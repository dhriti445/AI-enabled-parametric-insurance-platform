version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: parametric_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: parametric_insurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
